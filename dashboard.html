<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your personal dashboard for ST★R Tours — manage bookings and visa applications." />
  <title>Dashboard | ＳＴ ✪ Ｒ Tours And Travels</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <style>
    .dashboard-hero {
      text-align: center;
      padding: 3rem 1.5rem 1.5rem;
      animation: fadeInUp 0.6s ease both;
    }
    .dashboard-hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: var(--primary);
      margin-bottom: 0.5rem;
    }
    .dashboard-hero p {
      color: var(--text-mid);
      font-size: 1.1rem;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 2rem 3rem;
    }
    .dashboard-section {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      transition: box-shadow var(--transition), background-color var(--transition);
      animation: fadeInUp 0.6s ease both;
    }
    .dashboard-section:nth-child(1) { animation-delay: 0.1s; }
    .dashboard-section:nth-child(2) { animation-delay: 0.2s; }
    .dashboard-section:hover {
      box-shadow: var(--shadow-md);
    }
    .dashboard-section h2 {
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 2px solid var(--border-light);
      padding-bottom: 0.7rem;
    }
    .dashboard-section h2 i {
      color: var(--accent);
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .d-card {
      background: var(--bg-light);
      border-radius: var(--radius-sm);
      padding: 1rem 1.2rem;
      border-left: 4px solid var(--primary);
      transition: transform var(--transition), box-shadow var(--transition);
      animation: scaleIn 0.35s ease both;
    }
    .d-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .d-card .d-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 0.92rem;
    }
    .d-card .d-row .label {
      color: var(--text-light);
      font-weight: 500;
    }
    .d-card .d-row .value {
      color: var(--text-dark);
      font-weight: 600;
      text-align: right;
    }
    .d-card .d-actions {
      margin-top: 0.7rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: flex-end;
    }
    .btn-cancel {
      padding: 6px 16px;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
    }
    .btn-cancel:hover {
      background: #c0392b;
      transform: translateY(-1px);
    }
    body.dark-mode .btn-cancel {
      background: #c0392b;
    }
    body.dark-mode .btn-cancel:hover {
      background: #a93226;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #e8f5e9;
      color: #2e7d32;
    }
    body.dark-mode .status-badge {
      background: #1b4332;
      color: #6fcf97;
    }
    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-light);
    }
    .empty-state i {
      font-size: 2.5rem;
      margin-bottom: 0.6rem;
      opacity: 0.5;
    }
    .empty-state p {
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    .empty-state a {
      display: inline-block;
      padding: 8px 20px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background var(--transition), transform var(--transition);
    }
    .empty-state a:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }
    @media (max-width: 800px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
        padding: 0 1rem 2rem;
        gap: 1.5rem;
      }
      .dashboard-section {
        padding: 1.2rem;
      }
    }
  </style>
</head>

<body>

  <div id="navbar-placeholder"></div>

  <div class="dashboard-hero">
    <h1>My Dashboard</h1>
    <p>Manage your bookings and visa applications</p>
  </div>

  <div class="dashboard-grid">
    <div class="dashboard-section">
      <h2><i class="fas fa-suitcase-rolling"></i> My Bookings</h2>
      <div class="card-list" id="bookingsList"></div>
    </div>
    <div class="dashboard-section">
      <h2><i class="fas fa-passport"></i> My Visa Applications</h2>
      <div class="card-list" id="visaList"></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="dashboard.js"></script>
  <script src="components.js"></script>
</body>

</html>
