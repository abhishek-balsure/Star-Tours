<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Login or register with ST★R Tours and Travels">
  <title>Login / Register - ＳＴ ✪ Ｒ Tours</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="shared.css">

  <style>
    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #e0eaff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      background: #fff;
      width: 100%;
      max-width: 460px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: fadeInUp 0.6s ease;
    }

    .auth-header {
      background: var(--primary);
      color: #fff;
      padding: 28px;
      text-align: center;
      position: relative;
    }

    .auth-header img {
      height: 55px;
      margin-bottom: 8px;
      background: #fff;
      border-radius: 10px;
      padding: 4px;
    }

    .auth-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .auth-header p {
      opacity: 0.9;
      font-size: 0.9rem;
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      font-size: 24px;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.7);
      transition: color 0.3s;
      background: none;
      border: none;
    }

    .close-btn:hover {
      color: #fff;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid #eef1f7;
    }

    .tab {
      flex: 1;
      padding: 15px;
      text-align: center;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-mid);
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-size: 1rem;
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--accent);
    }

    .auth-form {
      padding: 30px;
      display: none;
      flex-direction: column;
      gap: 18px;
    }

    .auth-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--primary-light);
    }

    .form-group input {
      padding: 12px 15px;
      border: 1.5px solid #e0e4ed;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      transition: all 0.3s;
      background: #fafbff;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
      outline: none;
      background: #fff;
    }

    .submit-btn {
      background: var(--accent);
      color: #fff;
      padding: 14px;
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .submit-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 152, 0, 0.5);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #authMessage {
      display: none;
      padding: 13px 15px;
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
    }

    #authMessage.show {
      display: block;
    }

    #authMessage.error {
      background: #fff0f0;
      border: 1px solid #ffcdd2;
      color: #c62828;
    }

    #authMessage.success {
      background: #e6f9e6;
      border: 1px solid #b7e4c7;
      color: #2e7d32;
    }

    .demo-hint {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-mid);
      background: #f6f8fc;
      border-radius: var(--radius-sm);
      padding: 12px;
      line-height: 1.7;
    }

    .demo-hint code {
      background: #e8edf7;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.82rem;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-header">
      <button class="close-btn" onclick="window.location.href='index.html'">&times;</button>
      <img src="Logo/Logoo.png" alt="STAR Tours Logo">
      <h2>Welcome Back</h2>
      <p>Sign in to book tours, track visas, and more.</p>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">Login</button>
      <button class="tab" id="tabRegister" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <form class="auth-form active" id="loginForm">
      <div id="authMessage"></div>
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn" id="loginBtn">Login</button>
      <div class="demo-hint">
        Demo account: <code>demo@test.com</code> / <code>demo123</code><br>
        Admin account: <code>admin@startours.com</code> / <code>admin123</code>
      </div>
    </form>

    <!-- Register Form -->
    <form class="auth-form" id="registerForm">
      <div id="registerMessage"></div>
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="regPhone">Phone (optional)</label>
        <input type="tel" id="regPhone" placeholder="9876543210">
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="Min 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="submit-btn" id="registerBtn">Create Account</button>
    </form>
  </div>

  <script src="components.js"></script>
  <script>
    function switchTab(tab) {
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('loginForm').classList.toggle('active', tab === 'login');
      document.getElementById('registerForm').classList.toggle('active', tab === 'register');
      document.getElementById('authMessage').className = '';
      document.getElementById('registerMessage').className = '';
    }

    function showMessage(elId, type, text) {
      const el = document.getElementById(elId);
      el.className = 'show ' + type;
      el.textContent = text;
    }

    function handleAuthSuccess(data) {
      localStorage.setItem('star_token', data.token);
      localStorage.setItem('star_user', JSON.stringify(data.user));
      window.location.href = 'index.html';
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value.trim(),
            password: document.getElementById('loginPassword').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        handleAuthSuccess(data);
      } catch (err) {
        showMessage('authMessage', 'error', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.textContent = 'Creating...';
      try {
        const res = await fetch('http://localhost:5000/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('regName').value.trim(),
            email: document.getElementById('regEmail').value.trim(),
            phone: document.getElementById('regPhone').value.trim(),
            password: document.getElementById('regPassword').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');
        handleAuthSuccess(data);
      } catch (err) {
        showMessage('registerMessage', 'error', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>

</html>
