    <div class="container">
        <h1>Visa Application Form</h1>

        <form id="visaForm" method="POST" action="visa.php" enctype="multipart/form-data">
            <!-- Visa Type -->
            <label for="visaType">Visa Type:</label>
            <select id="visaType" name="visaType" onchange="populateCountries()" required>
                <option value="">-- Select Visa Type --</option>
                <option value="Tourist">Tourist</option>
                <!-- <option value="Business">Business</option>
                <option value="Student">Student</option>
                <option value="Work">Work</option> -->
            </select>

            <!-- Country -->
            <label for="country">Destination Country:</label>
            <select id="country" name="country" onchange="generateDocumentFields()" required>
                <option value="">-- Select Country --</option>
            </select>

            <!-- Personal Info -->
            <label for="fullName">Full Name:</label>
            <input type="text" name="fullName" required />

            <label for="email">Email:</label>
            <input type="email" name="email" required />

            <label for="phone">Phone Number:</label>
            <input type="tel" name="phone" required />

            <label for="passport">Passport Number:</label>
            <input type="text" name="passport" required />

            <label for="nationality">Nationality:</label>
            <input type="text" name="nationality" required />

            <label for="travelDates">Travel Dates:</label>
            <input type="text" name="travelDates" placeholder="e.g., 10 Aug 2025 – 25 Aug 2025" required />

            <!-- Document Upload Section -->
            <div id="documentsContainer">
                <h3>Upload Required Documents:</h3>
            </div>

            <button type="submit">Submit Application</button>
            <button type="reset" style="background-color: red;">Clear</button>
        </form>
    </div>

        function populateCountries() {
            const visaType = document.getElementById("visaType").value;
            const countrySelect = document.getElementById("country");
            countrySelect.innerHTML = `<option value="">-- Select Country --</option>`;

            if (visaType && visaRequirements[visaType]) {
                Object.keys(visaRequirements[visaType]).forEach(country => {
                    const opt = document.createElement("option");
                    opt.value = country;
                    opt.textContent = country;
                    countrySelect.appendChild(opt);
                });
            }
            document.getElementById("documentsContainer").innerHTML = "<h3>Upload Required Documents:</h3>";
        }

        function generateDocumentFields() {
            const visaType = document.getElementById("visaType").value;
            const country = document.getElementById("country").value;
            const docContainer = document.getElementById("documentsContainer");

            docContainer.innerHTML = "<h3>Upload Required Documents:</h3>";

            if (visaType && country && visaRequirements[visaType] && visaRequirements[visaType][country]) {
                visaRequirements[visaType][country].forEach((doc, index) => {
                    const label = document.createElement("label");
                    label.textContent = `${doc}:`;
                    const input = document.createElement("input");
                    input.type = "file";
                    input.name = `documents[${doc}]`;
                    input.required = true;
                    input.accept = ".pdf,.jpg,.png,.jpeg";

                    docContainer.appendChild(label);
                    docContainer.appendChild(input);
                });
            }
        }
