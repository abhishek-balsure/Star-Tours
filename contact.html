<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - ＳＴ ✪ Ｒ Tours and Travels</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />

    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="contact.css">
</head>

<body>
    <!-- Navigation Menu -->
    <div id="navbar-placeholder"></div>

    <main class="contact-container">
        <h1>📞 Get In Touch</h1>
        <p class="contact-subtitle">We are here to help you plan your perfect journey. Drop us a message!</p>

        <form id="contactForm" onsubmit="event.preventDefault(); saveContact();">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required />
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required />
                </div>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="How can we help?" required />
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" rows="5" placeholder="Tell us about your travel plans..." required></textarea>
            </div>

            <button type="submit" class="submit-btn"><i class="fas fa-paper-plane"></i> Send Message</button>
        </form>

        <div class="contact-methods">
            <div class="method-card">
                <i class="fas fa-phone-alt"></i>
                <h4>Call Us</h4>
                <p>+91-9876543210</p>
            </div>
            <div class="method-card">
                <i class="fas fa-envelope"></i>
                <h4>Email Us</h4>
                <p>info@stours.com</p>
            </div>
            <div class="method-card">
                <i class="fas fa-map-marker-alt"></i>
                <h4>Visit Us</h4>
                <p>Mumbai, Maharashtra, India</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="components.js"></script>
    <script src="save_contact.js"></script>
</body>

</html>
