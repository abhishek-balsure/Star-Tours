<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Book your dream tour with ST★R Tours and Travels">
  <title>Book Tour - ＳＴ ✪ Ｒ Tours</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="shared.css">
  
  <style>
    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #e0eaff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .booking-container {
      background: #fff;
      width: 100%;
      max-width: 700px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: fadeInUp 0.6s ease;
      position: relative;
    }

    .booking-header {
      background: var(--primary);
      color: #fff;
      padding: 30px;
      text-align: center;
      position: relative;
    }

    .booking-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .booking-header p {
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 24px;
      cursor: pointer;
      color: rgba(255,255,255,0.7);
      transition: color 0.3s;
    }

    .close-btn:hover {
      color: #fff;
    }

    .booking-form {
      padding: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--primary-light);
    }

    .form-group input, 
    .form-group select {
      padding: 12px 15px;
      border: 1.5px solid #e0e4ed;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      transition: all 0.3s;
      background: #fafbff;
    }

    .form-group input:focus, 
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
      outline: none;
      background: #fff;
    }

    .checkbox-group {
      grid-column: 1 / -1;
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .checkbox-item input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .cost-display {
      grid-column: 1 / -1;
      background: #f0f7ff;
      padding: 20px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #d0e4ff;
    }

    .cost-display span {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
    }

    .submit-btn {
      grid-column: 1 / -1;
      background: var(--accent);
      color: #fff;
      padding: 16px;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .submit-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 152, 0, 0.5);
    }

    #bookingMessage {
      display: none;
      grid-column: 1 / -1;
      padding: 15px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
    }
    #bookingMessage.show {
      display: block;
    }
    #bookingMessage.error {
      background: #fff0f0;
      border: 1px solid #ffcdd2;
      color: #c62828;
    }
    #bookingMessage.error ul {
      margin: 8px 0 0 20px;
      padding-left: 20px;
    }
    .success-card {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
    }
    .success-card .success-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }
    .success-card h2 {
      color: var(--primary);
      font-family: 'Orbitron', sans-serif;
      margin-bottom: 15px;
    }
    .success-card p {
      color: var(--text-mid);
      margin: 8px 0;
      line-height: 1.6;
    }
    .success-card .btn {
      margin-top: 20px;
    }
    .btn-home {
      display: inline-block;
      margin-top: 15px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .btn-home:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .booking-form {
        grid-template-columns: 1fr;
        padding: 25px;
      }
      .checkbox-group {
        flex-direction: column;
        gap: 12px;
      }
      .booking-header {
        padding: 20px;
      }
      .booking-header h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body>
  <div class="booking-container">
    <div class="booking-header">
      <span class="close-btn" onclick="window.location.href='index.html'">&times;</span>
      <h2>Plan Your Escape</h2>
      <p>Fill in the details to get an instant quote and book your spot.</p>
    </div>

    <form class="booking-form" id="bookingForm">
      <div id="bookingMessage"></div>
      <div class="form-group full-width">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label for="destination">Destination</label>
        <input type="text" id="destination" placeholder="e.g. Switzerland" required>
      </div>

      <div class="form-group">
        <label for="days">Days</label>
        <input type="number" id="days" min="1" value="1" required>
      </div>

      <div class="form-group">
        <label for="people">Travelers</label>
        <input type="number" id="people" min="1" value="1" required>
      </div>

      <div class="form-group">
        <label for="date">Travel Date</label>
        <input type="date" id="date" required>
      </div>

      <div class="form-group">
        <label for="return">Return Date</label>
        <input type="date" id="return" readonly>
      </div>

      <div class="checkbox-group">
        <label class="checkbox-item">
          <input type="checkbox" id="international"> International
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="luxury"> Luxury Package
        </label>
      </div>

      <div class="form-group">
        <label for="flight">Flight Class</label>
        <select id="flight">
          <option value="economy">Economy</option>
          <option value="business">Business</option>
          <option value="firstclass">First Class</option>
        </select>
      </div>

      <div class="form-group">
        <label for="hotel">Hotel Type</label>
        <select id="hotel">
          <option value="3star">Standard (3★)</option>
          <option value="4star">Premium (4★)</option>
          <option value="5star">Luxury (5★)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="meal">Meal Choice</label>
        <select id="meal">
          <option value="veg">Vegetarian</option>
          <option value="nonveg">Non-Vegetarian</option>
          <option value="both">All-Inclusive Both</option>
        </select>
      </div>

      <div class="form-group">
        <label for="guider">Tour Guide</label>
        <select id="guider">
          <option value="no">No, Self-Guided</option>
          <option value="yes">Yes, Expert Guide</option>
        </select>
      </div>

      <div class="cost-display">
        <strong>Total Estimate:</strong>
        <span>₹<span id="estimatedCost">0</span></span>
      </div>

      <button type="submit" class="submit-btn">Reserve My Journey</button>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="booking.js"></script>
</body>

</html>
