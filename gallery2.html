<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ＳＴ ✪ Ｒ Tours & Travels Gallery</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet" />
  <style>
    /* RESET & BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #01081c;
      color: #eee;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: #ee6e73;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    a:hover,
    a:focus {
      color: #ff4957;
      outline: none;
    }

    /* NAVBAR */
    nav[aria-label="Primary"] {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1rem;
      background: linear-gradient(90deg, #221d2d, #38394a);
      box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      color: #f66;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      font-weight: 600;
      font-size: 1rem;
      padding: 0.25rem 0.5rem;
    }

    .nav-links a.active,
    .nav-links a:hover,
    .nav-links a:focus {
      color: #ff4957;
      border-bottom: 2px solid #ff4957;
    }

    /* Responsive Nav */
    #nav-toggle {
      display: none;
    }

    label[for="nav-toggle"] {
      display: none;
      cursor: pointer;
      font-size: 1.5rem;
      color: #ee6e73;
    }

    @media (max-width: 768px) {
      .nav-links {
        position: fixed;
        top: 3.5rem;
        right: 0;
        background: #161c28;
        height: calc(100vh - 3.5rem);
        width: 200px;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.3s ease-in-out;
        padding-top: 1rem;
        box-shadow: -3px 0 8px rgba(0, 0, 0, 0.5);
        z-index: 9;
      }

      .nav-links a {
        padding: 1rem;
        font-size: 1.2rem;
        border-bottom: 1px solid #2e2e2e;
      }

      #nav-toggle:checked + label + ul.nav-links {
        transform: translateX(0);
      }

      label[for="nav-toggle"] {
        display: block;
      }
    }

    /* MAIN CONTENT */
    main {
      flex-grow: 1;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    header.gallery-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    header.gallery-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 2.5rem;
      letter-spacing: 0.15em;
      color: #f66;
    }

    header.gallery-header p {
      font-size: 1.1rem;
      margin-top: 0.5rem;
      color: #ddd;
    }

    /* GALLERY SLIDERS */
    section.gallery-category {
      margin-bottom: 3rem;
    }

    section.gallery-category h3 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 1.8rem;
      color: #f66;
      margin-bottom: 1rem;
      border-bottom: 2px solid #f66;
      display: inline-block;
    }

    .slider-container {
      overflow-x: auto;
      scroll-behavior: smooth;
      display: flex;
      gap: 1rem;
      padding-bottom: 0.5rem;
    }

    /* Scrollbar styling */
    .slider-container::-webkit-scrollbar {
      height: 8px;
    }

    .slider-container::-webkit-scrollbar-thumb {
      background: #ff4957;
      border-radius: 4px;
    }

    .slider-container::-webkit-scrollbar-track {
      background: #2a2a2a;
    }

    article.slide {
      flex: 0 0 auto;
      width: 220px;
      background: linear-gradient(135deg, #38394a, #2c2c38);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    article.slide:hover,
    article.slide:focus-within {
      transform: translateY(-8px);
      box-shadow: 0 10px 15px rgba(255, 73, 87, 0.7);
      outline: none;
    }

    article.slide img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      border-bottom: 2px solid #f66;
    }

    article.slide figcaption {
      padding: 0.75rem 1rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #eee;
    }

    .slide-title {
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
      color: #ff6f70;
    }

    .slide-rating {
      color: #ffcc00;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* FOOTER */
    footer[aria-label="Site Footer"] {
      background: linear-gradient(90deg, #221d2d, #38394a);
      color: #aaa;
      padding: 2rem 1rem;
      text-align: center;
      font-size: 0.9rem;
      user-select: none;
    }

    footer a {
      color: #ee6e73;
      margin: 0 0.5rem;
      font-weight: 600;
    }

    footer a:hover,
    footer a:focus {
      color: #ff4957;
      text-decoration: underline;
    }

    footer .social-icons {
      margin-top: 1rem;
    }

    footer .social-icons a {
      margin: 0 0.7rem;
      font-size: 1.4rem;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    footer .social-icons a:hover,
    footer .social-icons a:focus {
      transform: scale(1.15);
      color: #ff4957;
    }

    /* Responsive Footer */
    @media (min-width: 768px) {
      footer {
        text-align: left;
        padding: 3rem 4rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    }
  </style>
</head>

  <script>
    // Pause slider scroll animation on hover or touch devices

    // We'll implement a smooth scroll slider with pause on hover/touch.
    // For simplicity, no auto animation here - just manual horizontal scroll.

    // If you want auto-scrolling slider with pause on hover, we can implement below.

    const sliders = document.querySelectorAll('.slider-container');

    sliders.forEach(slider => {
      let isDown = false;
      let startX;
      let scrollLeft;

      // Mouse dragging for desktop
      slider.addEventListener('mousedown', e => {
        isDown = true;
        slider.classList.add('active');
        startX = e.pageX - slider.offsetLeft;
        scrollLeft = slider.scrollLeft;
      });

      slider.addEventListener('mouseleave', () => {
        isDown = false;
        slider.classList.remove('active');
      });

      slider.addEventListener('mouseup', () => {
        isDown = false;
        slider.classList.remove('active');
      });

      slider.addEventListener('mousemove', e => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - slider.offsetLeft;
        const walk = (x - startX) * 2; // Scroll-fast
        slider.scrollLeft = scrollLeft - walk;
      });

      // Touch events for mobile
      let touchStartX = 0;
      let touchScrollLeft = 0;

      slider.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].pageX;
        touchScrollLeft = slider.scrollLeft;
      });

      slider.addEventListener('touchmove', e => {
        const x = e.touches[0].pageX;
        const walk = (touchStartX - x) * 2;
        slider.scrollLeft = touchScrollLeft + walk;
      });
    });
  </script>
